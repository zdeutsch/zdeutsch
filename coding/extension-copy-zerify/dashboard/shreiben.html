<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database Manager | Shreiben</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/dashboard/assets/admin.css">
  </head>
  <body class="manager-body">
    <div class="container-fluid">
      <div class="row min-vh-100">
        <aside class="col-12 col-lg-2 manager-sidebar p-3">
          <div class="manager-brand fs-5 mb-3">ZDeutsch</div>
          <p class="small-help mb-4">Manage Shreiben tasks and prompts.</p>
          <nav class="d-grid gap-1">
            <a href="/dashboard/index.html" class="manager-nav-link" data-manager-nav="overview"><i class="bi bi-speedometer2"></i> Overview</a>
            <a href="/dashboard/config.html" class="manager-nav-link" data-manager-nav="config"><i class="bi bi-sliders"></i> Config</a>
            <a href="/dashboard/lesen.html" class="manager-nav-link" data-manager-nav="lesen"><i class="bi bi-journal-text"></i> Lesen</a>
            <a href="/dashboard/horen.html" class="manager-nav-link" data-manager-nav="horen"><i class="bi bi-headphones"></i> Horen</a>
            <a href="/dashboard/shreiben.html" class="manager-nav-link" data-manager-nav="shreiben"><i class="bi bi-pencil-square"></i> Shreiben</a>
          </nav>
        </aside>

        <main class="col-12 col-lg-10 manager-main">
          <header class="manager-header d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
            <div>
              <h1 class="h4 mb-1">Shreiben Tasks</h1>
              <p class="text-secondary mb-0">Create and edit writing tasks in clear business forms.</p>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
              <select id="level-select" class="form-select form-select-sm" style="width: 90px;">
                <option value="b1">B1</option>
                <option value="b2" selected>B2</option>
              </select>
              <input type="text" id="part-select" class="form-control form-control-sm" style="width: 130px;" value="teil-1">
              <button class="btn btn-outline-secondary btn-sm" id="refresh-btn"><i class="bi bi-arrow-repeat"></i></button>
            </div>
          </header>

          <div id="alert-host"></div>

          <section class="manager-card card mb-4">
            <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
              <span>Task List</span>
              <input id="tasks-search-input" type="search" class="form-control form-control-sm" style="width: 240px;" placeholder="Search tasks...">
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Task ID</th>
                      <th>Title</th>
                      <th>Prompt</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="tasks-body">
                    <tr><td colspan="4" class="text-center text-secondary py-4">Loading...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="manager-card card mb-4">
            <div class="card-header d-flex align-items-center justify-content-between">
              <span>Task Form</span>
              <button class="btn btn-sm btn-outline-secondary" id="clear-form-btn" type="button">Clear</button>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <label class="form-label" for="task-id">Task ID (optional when creating)</label>
                  <input type="text" id="task-id" class="form-control" placeholder="auto-generated">
                </div>
                <div class="col-12 col-md-8">
                  <label class="form-label" for="task-title">Task Title</label>
                  <input type="text" id="task-title" class="form-control" placeholder="Task title">
                </div>
                <div class="col-12">
                  <label class="form-label" for="task-prompt">Prompt</label>
                  <textarea id="task-prompt" class="form-control" rows="3" placeholder="Write the prompt"></textarea>
                </div>
              </div>

              <hr class="my-4">
              <h2 class="h6">Advertisement Block</h2>

              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label" for="ad-header">Ad Header</label>
                  <input type="text" id="ad-header" class="form-control">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="ad-tagline">Ad Tagline</label>
                  <input type="text" id="ad-tagline" class="form-control">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="ad-price">Price</label>
                  <input type="text" id="ad-price" class="form-control">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="ad-paragraphs">Paragraphs (one line = one paragraph)</label>
                  <textarea id="ad-paragraphs" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="ad-offer">Offer Items (one line each)</label>
                  <textarea id="ad-offer" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="ad-address">Address Lines (one line each)</label>
                  <textarea id="ad-address" class="form-control" rows="4"></textarea>
                </div>
              </div>

              <hr class="my-4">
              <h2 class="h6">Requirements</h2>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label" for="req-mode">Mode Lines (one line each)</label>
                  <textarea id="req-mode" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="req-points">Required Points (one line each)</label>
                  <textarea id="req-points" class="form-control" rows="4"></textarea>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-4">
                <button class="btn btn-manager-primary text-white" id="save-task-btn" type="button">Save Task</button>
                <button class="btn btn-outline-danger" id="delete-task-btn" type="button">Delete Task</button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dashboard/assets/admin.js"></script>
    <script src="/dashboard/assets/pages/shreiben.js"></script>
  </body>
</html>
