<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database Manager | Config</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/dashboard/assets/admin.css">
  </head>
  <body class="manager-body">
    <div class="container-fluid">
      <div class="row min-vh-100">
        <aside class="col-12 col-lg-2 manager-sidebar p-3">
          <div class="manager-brand fs-5 mb-3">ZDeutsch</div>
          <p class="small-help mb-4">Core app settings and module options.</p>
          <nav class="d-grid gap-1">
            <a href="/dashboard/index.html" class="manager-nav-link" data-manager-nav="overview"><i class="bi bi-speedometer2"></i> Overview</a>
            <a href="/dashboard/config.html" class="manager-nav-link" data-manager-nav="config"><i class="bi bi-sliders"></i> Config</a>
            <a href="/dashboard/lesen.html" class="manager-nav-link" data-manager-nav="lesen"><i class="bi bi-journal-text"></i> Lesen</a>
            <a href="/dashboard/horen.html" class="manager-nav-link" data-manager-nav="horen"><i class="bi bi-headphones"></i> Horen</a>
            <a href="/dashboard/shreiben.html" class="manager-nav-link" data-manager-nav="shreiben"><i class="bi bi-pencil-square"></i> Shreiben</a>
          </nav>
        </aside>

        <main class="col-12 col-lg-10 manager-main">
          <header class="manager-header d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
            <div>
              <h1 class="h4 mb-1">Configuration</h1>
              <p class="text-secondary mb-0">Update timer, display defaults, and active modules.</p>
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="reload-btn"><i class="bi bi-arrow-repeat"></i> Reload</button>
          </header>

          <div id="alert-host"></div>

          <form id="config-form" class="manager-card card mb-4">
            <div class="card-header">Global Settings</div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-md-3">
                  <label class="form-label" for="font-scale">Font Scale</label>
                  <input id="font-scale" type="number" class="form-control" step="0.05" min="0.5" max="2">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label" for="aside-width">Aside Width</label>
                  <input id="aside-width" type="text" class="form-control" placeholder="40%">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label" for="default-module">Default Module</label>
                  <input id="default-module" type="text" class="form-control" placeholder="lesen">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label d-block" for="show-meinlang-ad">Show MeinLang ad</label>
                  <div class="form-check form-switch mt-2">
                    <input id="show-meinlang-ad" type="checkbox" class="form-check-input">
                    <label class="form-check-label" for="show-meinlang-ad">Enabled</label>
                  </div>
                </div>
              </div>
            </div>
          </form>

          <section class="manager-card card mb-4">
            <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
              <span>Modules</span>
              <div class="d-flex align-items-center gap-2">
                <input id="modules-search-input" type="search" class="form-control form-control-sm" style="width: 240px;" placeholder="Search modules...">
                <button class="btn btn-sm btn-outline-primary" id="add-module-btn" type="button"><i class="bi bi-plus-circle"></i> Add Module</button>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Data File</th>
                      <th>Timer Enabled</th>
                      <th>Duration (min)</th>
                      <th>Pass %</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="modules-body"></tbody>
                </table>
              </div>
            </div>
          </section>

          <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-outline-secondary" id="reset-form-btn" type="button">Reset</button>
            <button class="btn btn-manager-primary text-white" id="save-config-btn" type="button">Save Configuration</button>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dashboard/assets/admin.js"></script>
    <script src="/dashboard/assets/pages/config.js"></script>
  </body>
</html>
