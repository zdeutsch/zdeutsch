<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database Manager | Lesen Teil 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/dashboard/assets/admin.css">
  </head>
  <body class="manager-body" data-part-key="teil-1" data-part-label="Lesen Teil 1">
    <div class="container-fluid">
      <div class="row min-vh-100">
        <aside class="col-12 col-lg-2 manager-sidebar p-3">
          <div class="manager-brand fs-5 mb-3">ZDeutsch</div>
          <p class="small-help mb-4">Lesen part editors.</p>
          <nav class="d-grid gap-1 mb-3">
            <a href="/dashboard/index.html" class="manager-nav-link" data-manager-nav="overview"><i class="bi bi-speedometer2"></i> Overview</a>
            <a href="/dashboard/config.html" class="manager-nav-link" data-manager-nav="config"><i class="bi bi-sliders"></i> Config</a>
            <a href="/dashboard/lesen.html" class="manager-nav-link" data-manager-nav="lesen"><i class="bi bi-journal-text"></i> Lesen</a>
            <a href="/dashboard/contributions.html" class="manager-nav-link" data-manager-nav="contributions"><i class="bi bi-check2-square"></i> Contributions</a>
            <a href="/dashboard/horen.html" class="manager-nav-link" data-manager-nav="horen"><i class="bi bi-headphones"></i> Horen</a>
            <a href="/dashboard/shreiben.html" class="manager-nav-link" data-manager-nav="shreiben"><i class="bi bi-pencil-square"></i> Shreiben</a>
          </nav>
          <div class="small-help text-uppercase mb-2">Lesen Parts</div>
          <nav class="d-grid gap-1">
            <a href="/dashboard/lesen-teil-1.html" class="manager-nav-link" data-part-link="teil-1">Teil 1</a>
            <a href="/dashboard/lesen-teil-2.html" class="manager-nav-link" data-part-link="teil-2">Teil 2</a>
            <a href="/dashboard/lesen-teil-3.html" class="manager-nav-link" data-part-link="teil-3">Teil 3</a>
            <a href="/dashboard/lesen-sprach-1.html" class="manager-nav-link" data-part-link="sprachbausteine-1">Sprach 1</a>
            <a href="/dashboard/lesen-sprach-2.html" class="manager-nav-link" data-part-link="sprachbausteine-2">Sprach 2</a>
          </nav>
        </aside>

        <main class="col-12 col-lg-10 manager-main">
          <header class="manager-header d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
            <div>
              <h1 class="h4 mb-1" id="page-title">Lesen Teil 1 Editor</h1>
              <p class="text-secondary mb-0" id="page-subtitle">Manage this part with structured forms.</p>
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="reload-btn"><i class="bi bi-arrow-repeat"></i> Reload</button>
          </header>

          <div id="alert-host"></div>

          <section class="manager-card card mb-4">
            <div class="card-header">Selector</div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-md-3">
                  <label class="form-label" for="level-select">Level</label>
                  <select id="level-select" class="form-select">
                    <option value="b1">B1</option>
                    <option value="b2" selected>B2</option>
                  </select>
                </div>
                <div class="col-12 col-md-5">
                  <label class="form-label" for="theme-select">Theme</label>
                  <select id="theme-select" class="form-select"></select>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label" for="version-select">Version</label>
                  <select id="version-select" class="form-select"></select>
                </div>
              </div>
            </div>
          </section>

          <div id="analysis-host"></div>

          <section class="manager-card card mb-4">
            <div class="card-header">Meta</div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label" for="meta-title">Title</label>
                  <input id="meta-title" type="text" class="form-control">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label" for="meta-level">Level (meta)</label>
                  <input id="meta-level" type="text" class="form-control">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label" for="meta-part-number">Part Number</label>
                  <input id="meta-part-number" type="number" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label" for="meta-part-label">Part Label</label>
                  <input id="meta-part-label" type="text" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label" for="meta-section">Section</label>
                  <input id="meta-section" type="text" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label" for="meta-source-url">Source URL</label>
                  <input id="meta-source-url" type="text" class="form-control">
                </div>
                <div class="col-12">
                  <label class="form-label" for="meta-extracted-at">Extracted At</label>
                  <input id="meta-extracted-at" type="text" class="form-control">
                </div>
              </div>
            </div>
          </section>

          <section class="manager-card card mb-4">
            <div class="card-header">Content</div>
            <div class="card-body" id="part-content-host"></div>
          </section>

          <div class="d-flex justify-content-end">
            <button class="btn btn-manager-primary text-white" id="save-btn" type="button">Save Part</button>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dashboard/assets/admin.js"></script>
    <script src="/dashboard/assets/pages/lesen-part-editor.js"></script>
  </body>
</html>
